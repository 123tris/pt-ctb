# The C# data engine (engine/): builds it and runs its tests. Byte-for-byte parity with tools/export.mjs needs the bot's
# private data, so it isn't checked here: run `npm run engine:parity` on a machine that has it.
name: engine

on:
  push:
    paths: ['engine/**', 'web/src/gen/**', '.github/workflows/engine.yml']
  pull_request:
    paths: ['engine/**', 'web/src/gen/**', '.github/workflows/engine.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The tests expect Lisbon and UTC behaviour that doesn't depend on the runner's zone.
      - run: dotnet test engine/PtCatch.Engine.slnx -c Release
        env:
          TZ: UTC
      # The web client's pack types are generated from the engine's schemas and committed (Pages has no .NET).
      - name: web/src/gen/packs.ts matches the schemas
        run: dotnet run --project engine/src/PtCatch.Engine.Cli -c Release -- gen-ts --check
