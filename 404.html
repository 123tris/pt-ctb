<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PT Catch</title>
<script>
  // An address that is no page of the site (the pages are answered by functions/[[path]].js). Go to the front page.
  const base = location.hostname.endsWith('github.io') ? `/${location.pathname.split('/')[1]}/` : '/';
  location.replace(base);
</script>
</head>
<body style="background:#1f191b;color:#f4ebee;font-family:system-ui,sans-serif">
<p>Redirecting to the <a href="./" style="color:#ff6b89">home page</a>…</p>
</body>
</html>
